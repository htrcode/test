<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="devagiriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="200" height="200" rx="36" fill="url(#devagiriBg)" />
  <rect x="3" y="3" width="194" height="194" rx="33" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Outer circular ring with text path -->
  <circle cx="100" cy="94" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Shield Base -->
  <path d="M 58 52 C 58 52 100 46 100 46 C 100 46 142 52 142 52 C 142 98 128 126 100 144 C 72 126 58 98 58 52 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)" />

  <!-- Inner Cross Motif -->
  <line x1="100" y1="54" x2="100" y2="136" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.8" />
  <line x1="68" y1="84" x2="132" y2="84" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Open Book of Knowledge -->
  <path d="M 80 102 C 88 98 96 100 100 103 C 104 100 112 98 120 102 L 120 116 C 112 112 104 114 100 117 C 96 114 88 112 80 116 Z"
        fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5" />
  <path d="M 100 103 L 100 117" stroke="#b45309" stroke-width="1.5" />

  <!-- Radiant Star of Devagiri -->
  <g transform="translate(100, 70)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Laurel Leaves Left & Right -->
  <path d="M 50 112 C 46 95 48 76 56 62" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 150 112 C 154 95 152 76 144 62" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Banner at bottom: DEVAGIRI -->
  <path d="M 40 156 Q 100 148 160 156 L 154 174 Q 100 166 46 174 Z" fill="url(#goldGrad)" />
  <text x="100" y="168" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">DEVAGIRI</text>

  <!-- Subtitle: ESTD 1956 • AUTONOMOUS -->
  <text x="100" y="188" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="1">ESTD 1956 • AUTONOMOUS</text>
  <text x="100" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="0.5">ST. JOSEPH'S COLLEGE</text>
</svg>
